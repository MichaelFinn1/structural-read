const bar = document.getElementById("bar");
const label = document.getElementById("label");

  const size = data.sizes[parseInt(dial.value)];

  bar.innerHTML = "";

  const rows = data.rows.filter(r => parseInt(r.window_size) === size);

  rows.forEach(r => {
